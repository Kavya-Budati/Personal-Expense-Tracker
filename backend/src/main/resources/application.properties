# ---------------------------------------------------------------
# Personal Expense Tracker - backend configuration
# EDIT the three datasource lines below to match YOUR local MySQL.
# ---------------------------------------------------------------
spring.application.name=personal-expense-tracker

# 1) Database URL: host, port and database name (database must already exist)
spring.datasource.url=jdbc:mysql://localhost:3306/personal_expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# 2) MySQL username
spring.datasource.username=${DB_USERNAME:root}
# 3) MySQL password  <-- replace YOUR_MYSQL_PASSWORD with your own password
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates the TABLES automatically (the database itself must exist).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8081
